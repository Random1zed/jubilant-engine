"Config version - DO NOT CHANGE" = 1.1

#General settings
[General]
	#Specifies how many armor pieces must be worn for a set's effects to work.
	#Range: 1 ~ 4
	"Armor pieces required for Set Effects" = 2
	#Should Set Effects use durability of worn armor to work
	"Set Effects use durability" = false

#Settings that affect armor stats for all sets
["Armor Stats"]
	#Multiplied by armor's durability
	#Range: 0.0 ~ 999999.0
	"Global Durability Modifier" = 1.0
	#Multiplied by armor's damage reduction
	#Range: 0.0 ~ 999999.0
	"Global Damage Reduction Modifier" = 1.0
	#Multiplied by armor's toughness
	#Range: 0.0 ~ 999999.0
	"Global Tougness Modifier" = 1.0
	#Multiplied by armor's knockback resistance
	#Range: 0.0 ~ 999999.0
	"Global Knockback Resistance Modifier" = 1.0
	#Multiplied by armor's enchantability
	#Range: 0.0 ~ 999999.0
	"Global Enchantability Modifier" = 1.0

